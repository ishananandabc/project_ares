<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDLINE — Bradbury Landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090b}
body{font-family:'Roboto',Inter,system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab}
.hud{position:fixed;z-index:10;left:18px;top:18px;width:330px;background:#090d10e8;color:#eef2f4;
border:1px solid #ffffff20;border-radius:14px;padding:15px 16px;backdrop-filter:blur(12px)}
.brand{font-weight:900;letter-spacing:.18em;font-size:19px}.sub{opacity:.62;font-size:12px;margin-top:3px}
.row{display:flex;justify-content:space-between;gap:14px;margin-top:10px;font-size:12px}.row span:first-child{opacity:.58}
.ok{color:#4cff9a}.status{position:fixed;right:18px;bottom:18px;background:#090d10e8;color:#fff;
padding:9px 12px;border-radius:10px;font-size:12px;border:1px solid #ffffff1c}
</style></head><body>
<canvas id="map"></canvas>
<div class="hud"><div class="brand">REDLINE</div><div class="sub" id="terrain-build">Loading regional terrain…</div>
<div class="row"><span>Origin</span><strong>Bradbury Landing</strong></div>
<div class="row"><span>NASA position</span><strong>4.5895°S, 137.4417°E</strong></div>
<div class="row"><span>Terrain</span><strong class="ok">Real Gale DEM ✓</strong></div>
<div class="row"><span>Local frame</span><strong>metres (E, N)</strong></div>
<div class="row"><span>3D simulation</span><a href="./3d.html" style="color:#9ddfff">Open terrain viewer →</a></div></div>
<div class="status" id="status">Loading…</div><select id="terrain-layer" aria-label="Terrain overlay" style="position:fixed;right:18px;top:18px;z-index:10;background:#090d10;color:white;padding:9px;border-radius:8px"><option value="none">Imagery</option><option value="elevation">Elevation tint</option><option value="slope">Slope tint</option></select>
<script type="module">
import {loadTerrainBuild,sampleTerrain} from './terrain-core.js';
(async()=>{
const c=document.querySelector("canvas"),ctx=c.getContext("2d"),status=document.querySelector("#status");
const {manifest:m,url:terrainUrl,query:terrain}=await loadTerrainBuild();
document.querySelector('#terrain-build').textContent=`Build ${m.build_id} · ${(m.extent.width_m/1000).toFixed(2)} × ${(m.extent.height_m/1000).toFixed(1)} km`;
const img=new Image(),hiRise=new Image();img.src=terrainUrl('neutral');hiRise.src=terrainUrl('hirise');await Promise.all([img.decode(),hiRise.decode()]);
const B={xmin_m:m.extent.local_left_m,xmax_m:m.extent.local_right_m,ymin_m:m.extent.local_bottom_m,ymax_m:m.extent.local_top_m};
const R=m.mars_radius_m,rad=180/Math.PI;
let overlayMode="none",overlayImage=null,imageMaskContext=null;
function hasHiRise(x,y){const b=m.source_imagery.bounds,px=m.landing.projected_x_m+x,py=m.landing.projected_y_m+y;if(px<b[0]||px>=b[2]||py<=b[1]||py>b[3])return false;
if(!imageMaskContext){const cv=document.createElement('canvas');cv.width=hiRise.width;cv.height=hiRise.height;imageMaskContext=cv.getContext('2d',{willReadFrequently:true});imageMaskContext.drawImage(hiRise,0,0)}
const col=Math.floor((x-B.xmin_m)/(B.xmax_m-B.xmin_m)*hiRise.width),row=Math.floor((B.ymax_m-y)/(B.ymax_m-B.ymin_m)*hiRise.height);
return col>=0&&row>=0&&col<hiRise.width&&row<hiRise.height&&imageMaskContext.getImageData(col,row,1,1).data[3]>0}
function terrainAt(x,y){const result=sampleTerrain(m,terrain,x,y);if(result.status==='valid')result.imagery=hasHiRise(x,y)?'HiRISE':'no_high_resolution_imagery';return result}
function makeOverlay(){overlayImage=new Image();overlayImage.src=terrainUrl(overlayMode);overlayImage.decode().then(draw)}
function makeSafeCanvas(mask){if(!mask||!mask.width||!mask.height)return null;const cv=document.createElement("canvas");cv.width=mask.width;cv.height=mask.height;const o=cv.getContext("2d"),pix=o.createImageData(mask.width,mask.height),cells=mask.cells||[];for(let i=0;i<mask.width*mask.height;i++){if(!cells[i])continue;const k=i*4;pix.data[k]=0;pix.data[k+1]=255;pix.data[k+2]=120;pix.data[k+3]=70}o.putImageData(pix,0,0);return cv}
let s=1,ox=0,oy=0,drag=false,lx=0,ly=0;
const astronaut={x_m:0,y_m:0}; let envelope=[], route=[], routeStops=[], safeMask=null, safeCanvas=null;
function resize(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+"px";
c.style.height=innerHeight+"px";ctx.setTransform(d,0,0,d,0,0);fit();draw()}
function fit(){s=Math.min(innerWidth/img.width,innerHeight/img.height);ox=(innerWidth-img.width*s)/2;oy=(innerHeight-img.height*s)/2}
function ms(x,y){return{x:ox+((x-B.xmin_m)/(B.xmax_m-B.xmin_m))*img.width*s,
y:oy+(1-(y-B.ymin_m)/(B.ymax_m-B.ymin_m))*img.height*s}}
function sm(x,y){let u=((x-ox)/s)/img.width,v=((y-oy)/s)/img.height;
return{x_m:B.xmin_m+u*(B.xmax_m-B.xmin_m),y_m:B.ymin_m+(1-v)*(B.ymax_m-B.ymin_m),inside:u>=0&&u<=1&&v>=0&&v<=1,
lon:(m.landing.projected_x_m+B.xmin_m+u*(B.xmax_m-B.xmin_m))/R*rad,lat:(m.landing.projected_y_m+B.ymin_m+(1-v)*(B.ymax_m-B.ymin_m))/R*rad}}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.drawImage(img,ox,oy,img.width*s,img.height*s);if(overlayMode==='none')ctx.drawImage(hiRise,ox,oy,img.width*s,img.height*s);
if(overlayMode!=="none"&&overlayImage?.complete)ctx.drawImage(overlayImage,ox,oy,img.width*s,img.height*s);
if(safeCanvas){const a=ms(safeMask.left_m,safeMask.top_m),b=ms(safeMask.left_m+safeMask.width*safeMask.cell_size_m,safeMask.top_m-safeMask.height*safeMask.cell_size_m);ctx.save();ctx.beginPath();ctx.rect(ox,oy,img.width*s,img.height*s);ctx.clip();ctx.drawImage(safeCanvas,a.x,a.y,b.x-a.x,b.y-a.y);ctx.restore()}
if(envelope.length>2){ctx.beginPath();envelope.forEach((p,i)=>{let q=ms(p.x_m,p.y_m);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});
ctx.closePath();ctx.fillStyle="#00e67622";ctx.strokeStyle="#00ff80";ctx.lineWidth=3;ctx.fill();ctx.stroke()}
if(route.length>1){ctx.save();ctx.lineJoin="round";ctx.lineCap="round";const stroke=(color,width,dash)=>{ctx.beginPath();route.forEach((p,i)=>{const q=ms(p.x_m,p.y_m);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.setLineDash(dash||[]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()};stroke("rgba(0,0,0,.7)",8,[]);stroke("#ffd166",4,[]);ctx.restore()}
routeStops.forEach(s=>{const q=ms(s.x_m,s.y_m);ctx.beginPath();ctx.arc(q.x,q.y,5,0,Math.PI*2);ctx.fillStyle="#ff9f1c";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();if(s.label){ctx.fillStyle="#fff";ctx.font="600 12px 'Roboto', system-ui";ctx.fillText(s.label,q.x+9,q.y-8)}});
let p=ms(0,0);ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fillStyle="#ff3b30";ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.fill();ctx.stroke();
ctx.fillStyle="#fff";ctx.font="600 12px 'Roboto', system-ui";ctx.fillText("Bradbury Landing / origin",p.x+13,p.y-10);
if(astronaut.x_m!==0||astronaut.y_m!==0){let a=ms(astronaut.x_m,astronaut.y_m);ctx.beginPath();ctx.arc(a.x,a.y,7,0,Math.PI*2);ctx.fillStyle="#4cf";ctx.fill();ctx.strokeStyle="#fff";ctx.stroke()}
ctx.strokeStyle="#fff8";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x-15,p.y);ctx.lineTo(p.x+15,p.y);ctx.moveTo(p.x,p.y-15);ctx.lineTo(p.x,p.y+15);ctx.stroke()}
c.onwheel=e=>{e.preventDefault();let bx=(e.clientX-ox)/s,by=(e.clientY-oy)/s,f=Math.exp(-e.deltaY*.0014),ns=Math.max(.03,Math.min(s*f,20));
ox=e.clientX-bx*ns;oy=e.clientY-by*ns;s=ns;draw()}
c.onmousedown=e=>{drag=true;lx=e.clientX;ly=e.clientY};onmouseup=()=>drag=false;
onmousemove=e=>{if(drag){ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;draw()}
let q=sm(e.clientX,e.clientY),t=terrainAt(q.x_m,q.y_m);status.textContent=`E ${q.x_m.toFixed(0)} m · N ${q.y_m.toFixed(0)} m · ${Math.abs(q.lat).toFixed(5)}°${q.lat<0?"S":"N"} · ${q.lon.toFixed(5)}°E · ${t.status==='valid'?`Elevation ${t.elevation.toFixed(1)} m · Relative ${t.relative>=0?'+':''}${t.relative.toFixed(1)} m · Slope ${Number.isFinite(t.slope)?t.slope.toFixed(1)+'°':'—'} · ${t.imagery==='HiRISE'?'HiRISE':'No high-resolution imagery'}`:t.status==='nodata'?'DEM nodata':t.status==='outside_dataset'?'Outside DEM dataset':'Outside processed region'}`}
window.REDLINE={setEnvelope:p=>{envelope=p||[];draw()},setAstronaut:(x,y)=>{astronaut.x_m=x;astronaut.y_m=y;draw()},setRoute:r=>{route=r||[];draw()},setStops:s=>{routeStops=s||[];draw()},setSafeRegion:m=>{safeMask=m||null;safeCanvas=makeSafeCanvas(safeMask);draw()},setPlan:plan=>{plan=plan||{};route=plan.route||[];routeStops=plan.stops||[];safeMask=plan.safe_region||null;safeCanvas=makeSafeCanvas(safeMask);if(plan.astronaut!==undefined){astronaut.x_m=plan.astronaut.x_m||0;astronaut.y_m=plan.astronaut.y_m||0}if(plan.envelope!==undefined)envelope=plan.envelope||[];draw()},fit:()=>{fit();draw()},terrainAt,setTerrainOverlay:mode=>{if(!["none","elevation","slope"].includes(mode))throw Error("Unknown overlay");overlayMode=mode;if(mode!=="none")makeOverlay();draw()}};
fetch("./plan.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(p=>window.REDLINE.setPlan(p)).catch(e=>console.warn("No plan.json yet - run `cargo run --release` from the repo root.",e));
document.querySelector("#terrain-layer").onchange=e=>window.REDLINE.setTerrainOverlay(e.target.value);onresize=resize;resize();status.textContent='Move the pointer over terrain to inspect it.';
})();
</script></body></html>
